# Crowded Galaxy — Star map (canonical map data)
# 30 systems: outer rim (12), middle ring (12), inner ring (5), core (1).
# positions: starting coordinates on a 1000x1000 canvas, rings laid out
#   radially (outer r=430, middle r=290, inner r=155, core centered).
#   Hand-tune freely for art direction; nothing derives from geometry.
# neutrals: neutral defender tokens seeded at setup (v0.2 rule).
# planets: terran, ocean, barren, gas_giant, ice, volcanic.

schema: crowded-galaxy-map/1
version: 0.2

config:
  canvas: { width: 1000, height: 1000 }
  neutral_seeding_note: >-
    Baseline: outer rim 0, middle ring 1 each, inner ring 1 each, Blue
    Silence 2 (19 tokens total). Per-system values below are the source
    of truth; GameConfig may scale them for playtesting.

