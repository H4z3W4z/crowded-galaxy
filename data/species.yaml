# Crowded Galaxy — Species roster (canonical card data)
# Edit this file to change species; the design doc only summarizes it.
# population: tokens contributed to the combined pool (species + trait).
# habitat: one of terran, ocean, barren, gas_giant, ice, volcanic.
# Design rule (v0.2): abilities are unhedged — no "first per turn" rationing.
# Balance lives in the population value, Small World style.

schema: crowded-galaxy-species/1
version: 0.2

species:
  - id: thalassi_compact
    name: Thalassi Compact
    population: 6
    habitat: ocean
    sw_analog: Tritons
    status: unhedged
    active: >-
      Ocean systems cost 1 fewer population to conquer, minimum 1.
    remnant: >-
      Score +1 Influence if your Remnants control at least two Ocean systems.

  - id: pelagic_oracles
    name: Pelagic Oracles
    population: 5
    habitat: ocean
    sw_analog: Sorcerers
    status: reworked
    active: >-
      Once per turn per opponent, replace a lone active enemy population
      token adjacent to your active empire with one of your tokens from
      the supply. The replaced token is removed from the game.
    remnant: >-
      Score +1 Influence if your Remnants are adjacent to any active
      opponent empire.
    notes: >-
      The game's only direct token-theft. Turn replays must show the
      conversion clearly in async play.

  - id: heliox_aerostats
    name: Heliox Aerostats
    population: 4
    habitat: gas_giant
    sw_analog: Giants
    status: reworked
    active: >-
      You may conquer any Gas Giant system on the map, whether or not it is
      adjacent to your empire. Pay the normal cost.
    notes: >-
      v0.6: was "Gas Giant systems cost 1 fewer" — mechanically the same card
      as Thalassi Compact with a different terrain word, and the scattered Gas
      Giants made it the weakest species. The atmospheric network turns that
      scattering into the whole point. Population 6 -> 4: the network is a very
      loud ability, so it buys a small body (measured: pop 6 put it 2nd at
      51.4, pop 4 puts it mid-table at 44.0).
    remnant: >-
      Remnant tokens in Gas Giant systems count as two population when
      calculating conquest cost against them.

  - id: jovian_reavers
    name: Jovian Reavers
    population: 5
    habitat: gas_giant
    sw_analog: Amazons
    status: reworked
    former_name: Jovian Grazers
    active: >-
      At the start of your conquest phase, take 4 bonus population tokens
      from the supply. They may be used for conquests but must be returned
      to the supply before redeployment.
    remnant: >-
      Score +1 Influence if your Remnants control at least two Gas Giant
      systems.
    notes: >-
      Tempo archetype — huge turns, fragile holdings, natural
      early-collapse candidate.

  - id: ferrum_continuum
    name: Ferrum Continuum
    population: 5
    habitat: barren
    sw_analog: Trolls
    status: kept
    active: >-
      Every Barren system you control has +1 defense.
    remnant: >-
      Barren systems containing your Remnants retain the +1 defense.

  - id: ossian_prospectors
    name: Ossian Prospectors
    population: 7
    habitat: barren
    sw_analog: Dwarves
    status: reworked
    active: >-
      Score +1 Influence for every two Barren systems your active empire
      controls.
    remnant: >-
      Score +1 Influence if your Remnants control two or more Barren
      systems.
    notes: >-
      v0.4: reworked for single-planet systems (was "systems with 2+
      Barren planets" / "any 3-planet system", both impossible now).
      Barren-concentration specialist.

  - id: cryari_revenants
    name: Cryari Revenants
    population: 8
    habitat: ice
    sw_analog: Ghouls + Ratmen
    status: reworked
    former_name: Cryari Clans
    active: >-
      None. Raw numbers — the largest population value in the game.
    remnant: >-
      When this civilization Collapses, keep ALL of its population on the
      map instead of reducing to one token per system. On each of your
      turns, the Remnant may conquer one adjacent system, paying normal
      costs from its on-map population.
    notes: >-
      The frozen dead keep marching. Collapse timing for this species is a
      distinct AI evaluation problem. Watch the Echoing trait combo.

  - id: vitrifrost_collective
    name: Vitrifrost Collective
    population: 5
    habitat: ice
    sw_analog: Elves
    status: unhedged
    active: >-
      Your active tokens are never lost as casualties. When one of your
      systems is conquered, redeploy every token instead of removing one.
    remnant: >-
      Ice systems containing your Remnants have +1 defense.
    notes: >-
      Full Elves. Strong over 12 rounds of attrition — the 5 pop and lack
      of growth is the counterweight. Playtest watch-list.

  - id: kharax_brood
    name: Kharax Brood
    population: 5
    habitat: volcanic
    sw_analog: Skeletons
    status: reworked
    active: >-
      At the end of your conquest phase, add 1 population token from the
      supply for every two non-empty systems you conquered this turn.
    remnant: >-
      When a Volcanic system containing your Remnants is conquered, the
      attacker removes one participating population token after the
      conquest.

  - id: magmaforged
    name: Magmaforged
    population: 6
    habitat: volcanic
    sw_analog: Giants / Underworld
    status: unhedged
    active: >-
      Ignore all Hazard defense modifiers.
    remnant: >-
      Remnants in Hazard systems have +1 defense.

  - id: verdant_mycelium
    name: Verdant Mycelium
    population: 5
    habitat: terran
    sw_analog: original
    status: kept
    active: >-
      At the end of redeployment, add one population token from the supply
      to one Terran system you control.
    remnant: >-
      Score +1 Influence if your Remnants control two adjacent Terran
      systems.

  - id: concord_of_many
    name: Concord of Many
    population: 7
    habitat: terran
    sw_analog: original (Ghouls-lite)
    status: kept
    active: >-
      Your active empire may expand through your own Remnant systems as if
      they were active systems, without removing them.
    remnant: >-
      Your active empire may use your Remnant systems as conquest origins.
